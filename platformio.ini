[platformio]
default_envs = esp32dev

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
monitor_rts=0
monitor_dtr=0

; A bare PlatformIO build always selects this motor-locked environment.
[env:esp32dev]
build_flags =
    -DAGV_RAISED_WHEEL_BUILD=0
    -DAGV_MOTOR_OUTPUTS_ENABLED=0
    -DAGV_TRAJECTORY_PREVIEW_ENABLED=0
    -DAGV_TRAJECTORY_TRACE_ENABLED=0
    -DAGV_PHYSICAL_FLEET_ENABLED=0
    -DAGV_PHYSICAL_FLEET_MOTOR_ENABLED=0
    -DAGV_STRAIGHT_CALIBRATION_ENABLED=0
    -DAGV_STRAIGHT_CALIBRATION_MOTOR_ENABLED=0
    -DAGV_TURN_CALIBRATION_ENABLED=0
    -DAGV_TURN_CALIBRATION_MOTOR_ENABLED=0
    -DAGV_TURN_CALIBRATION_DIRECTION=0

; Motor-locked protocol/odometry preview. It can receive and store a
; TRAJECTORY_COMMAND but has no path-follower or motor execution path.
[env:esp32dev-trajectory-preview]
build_flags =
    -DAGV_RAISED_WHEEL_BUILD=0
    -DAGV_MOTOR_OUTPUTS_ENABLED=0
    -DAGV_TRAJECTORY_PREVIEW_ENABLED=1
    -DAGV_TRAJECTORY_TRACE_ENABLED=0
    -DAGV_PHYSICAL_FLEET_ENABLED=0
    -DAGV_PHYSICAL_FLEET_MOTOR_ENABLED=0
    -DAGV_STRAIGHT_CALIBRATION_ENABLED=0
    -DAGV_STRAIGHT_CALIBRATION_MOTOR_ENABLED=0
    -DAGV_TURN_CALIBRATION_ENABLED=0
    -DAGV_TURN_CALIBRATION_MOTOR_ENABLED=0
    -DAGV_TURN_CALIBRATION_DIRECTION=0

; Pure-Pursuit geometry analysis only. It processes a received preview one
; waypoint per loop and has no velocity, PWM, STATUS, ARRIVED, or BOOT path.
[env:esp32dev-trajectory-trace]
build_flags =
    -DAGV_RAISED_WHEEL_BUILD=0
    -DAGV_MOTOR_OUTPUTS_ENABLED=0
    -DAGV_TRAJECTORY_PREVIEW_ENABLED=1
    -DAGV_TRAJECTORY_TRACE_ENABLED=1
    -DAGV_PHYSICAL_FLEET_ENABLED=0
    -DAGV_PHYSICAL_FLEET_MOTOR_ENABLED=0
    -DAGV_STRAIGHT_CALIBRATION_ENABLED=0
    -DAGV_STRAIGHT_CALIBRATION_MOTOR_ENABLED=0
    -DAGV_TURN_CALIBRATION_ENABLED=0
    -DAGV_TURN_CALIBRATION_MOTOR_ENABLED=0
    -DAGV_TURN_CALIBRATION_DIRECTION=0

; Explicit raised-wheel test profile. This firmware must never be floor-tested.
[env:esp32dev-raised-wheel]
build_flags =
    -DAGV_RAISED_WHEEL_BUILD=1
    -DAGV_MOTOR_OUTPUTS_ENABLED=1
    -DAGV_TRAJECTORY_PREVIEW_ENABLED=0
    -DAGV_TRAJECTORY_TRACE_ENABLED=0
    -DAGV_PHYSICAL_FLEET_ENABLED=0
    -DAGV_PHYSICAL_FLEET_MOTOR_ENABLED=0
    -DAGV_STRAIGHT_CALIBRATION_ENABLED=0
    -DAGV_STRAIGHT_CALIBRATION_MOTOR_ENABLED=0
    -DAGV_TURN_CALIBRATION_ENABLED=0
    -DAGV_TURN_CALIBRATION_MOTOR_ENABLED=0
    -DAGV_TURN_CALIBRATION_DIRECTION=0

; Full TestCase0 LINE/point-turn state machine with the bridge compile-locked.
; It is useful for protocol inspection but can never report a false arrival.
[env:esp32dev-physical-fleet-locked]
build_flags =
    -DAGV_RAISED_WHEEL_BUILD=0
    -DAGV_MOTOR_OUTPUTS_ENABLED=0
    -DAGV_TRAJECTORY_PREVIEW_ENABLED=0
    -DAGV_TRAJECTORY_TRACE_ENABLED=0
    -DAGV_PHYSICAL_FLEET_ENABLED=1
    -DAGV_PHYSICAL_FLEET_MOTOR_ENABLED=0
    -DAGV_STRAIGHT_CALIBRATION_ENABLED=0
    -DAGV_STRAIGHT_CALIBRATION_MOTOR_ENABLED=0
    -DAGV_TURN_CALIBRATION_ENABLED=0
    -DAGV_TURN_CALIBRATION_MOTOR_ENABLED=0
    -DAGV_TURN_CALIBRATION_DIRECTION=0

; Explicit live TestCase0 floor profile. Uploading this target permits motor
; output only after local BOOT approval and the five-second countdown.
[env:esp32dev-physical-fleet]
build_flags =
    -DAGV_RAISED_WHEEL_BUILD=0
    -DAGV_MOTOR_OUTPUTS_ENABLED=1
    -DAGV_TRAJECTORY_PREVIEW_ENABLED=0
    -DAGV_TRAJECTORY_TRACE_ENABLED=0
    -DAGV_PHYSICAL_FLEET_ENABLED=1
    -DAGV_PHYSICAL_FLEET_MOTOR_ENABLED=1
    -DAGV_STRAIGHT_CALIBRATION_ENABLED=0
    -DAGV_STRAIGHT_CALIBRATION_MOTOR_ENABLED=0
    -DAGV_TURN_CALIBRATION_ENABLED=0
    -DAGV_TURN_CALIBRATION_MOTOR_ENABLED=0
    -DAGV_TURN_CALIBRATION_DIRECTION=0

; Network-free one-shot 30 cm calibration with the bridge compile-locked.
; This validates the entrypoint and output lock without producing wheel data.
[env:esp32dev-straight-calibration-locked]
build_src_filter =
    +<MotionController.cpp>
    +<PhysicalFleetAuthorization.cpp>
    +<StraightCalibrationMain.cpp>
build_flags =
    -DAGV_RAISED_WHEEL_BUILD=0
    -DAGV_MOTOR_OUTPUTS_ENABLED=0
    -DAGV_TRAJECTORY_PREVIEW_ENABLED=0
    -DAGV_TRAJECTORY_TRACE_ENABLED=0
    -DAGV_PHYSICAL_FLEET_ENABLED=0
    -DAGV_PHYSICAL_FLEET_MOTOR_ENABLED=0
    -DAGV_STRAIGHT_CALIBRATION_ENABLED=1
    -DAGV_STRAIGHT_CALIBRATION_MOTOR_ENABLED=0
    -DAGV_TURN_CALIBRATION_ENABLED=0
    -DAGV_TURN_CALIBRATION_MOTOR_ENABLED=0
    -DAGV_TURN_CALIBRATION_DIRECTION=0

; Explicit opt-in one-shot straight calibration. It has no Wi-Fi/TCP path and
; can energize the bridge only after BOOT plus the five-second countdown.
[env:esp32dev-straight-calibration]
build_src_filter =
    +<MotionController.cpp>
    +<PhysicalFleetAuthorization.cpp>
    +<StraightCalibrationMain.cpp>
build_flags =
    -DAGV_RAISED_WHEEL_BUILD=0
    -DAGV_MOTOR_OUTPUTS_ENABLED=1
    -DAGV_TRAJECTORY_PREVIEW_ENABLED=0
    -DAGV_TRAJECTORY_TRACE_ENABLED=0
    -DAGV_PHYSICAL_FLEET_ENABLED=0
    -DAGV_PHYSICAL_FLEET_MOTOR_ENABLED=0
    -DAGV_STRAIGHT_CALIBRATION_ENABLED=1
    -DAGV_STRAIGHT_CALIBRATION_MOTOR_ENABLED=1
    -DAGV_TURN_CALIBRATION_ENABLED=0
    -DAGV_TURN_CALIBRATION_MOTOR_ENABLED=0
    -DAGV_TURN_CALIBRATION_DIRECTION=0

; Network-free one-shot 90-degree turn with the bridge compile-locked.
[env:esp32dev-turn-calibration-locked]
build_src_filter =
    -<*>
    +<MotionController.cpp>
    +<PhysicalFleetAuthorization.cpp>
    +<TurnCalibrationMain.cpp>
build_flags =
    -DAGV_RAISED_WHEEL_BUILD=0
    -DAGV_MOTOR_OUTPUTS_ENABLED=0
    -DAGV_TRAJECTORY_PREVIEW_ENABLED=0
    -DAGV_TRAJECTORY_TRACE_ENABLED=0
    -DAGV_PHYSICAL_FLEET_ENABLED=0
    -DAGV_PHYSICAL_FLEET_MOTOR_ENABLED=0
    -DAGV_STRAIGHT_CALIBRATION_ENABLED=0
    -DAGV_STRAIGHT_CALIBRATION_MOTOR_ENABLED=0
    -DAGV_TURN_CALIBRATION_ENABLED=1
    -DAGV_TURN_CALIBRATION_MOTOR_ENABLED=0
    -DAGV_TURN_CALIBRATION_DIRECTION=1

; Explicit opt-in clockwise 90-degree point-turn test.
[env:esp32dev-turn-calibration-cw]
build_src_filter =
    -<*>
    +<MotionController.cpp>
    +<PhysicalFleetAuthorization.cpp>
    +<TurnCalibrationMain.cpp>
build_flags =
    -DAGV_RAISED_WHEEL_BUILD=0
    -DAGV_MOTOR_OUTPUTS_ENABLED=1
    -DAGV_TRAJECTORY_PREVIEW_ENABLED=0
    -DAGV_TRAJECTORY_TRACE_ENABLED=0
    -DAGV_PHYSICAL_FLEET_ENABLED=0
    -DAGV_PHYSICAL_FLEET_MOTOR_ENABLED=0
    -DAGV_STRAIGHT_CALIBRATION_ENABLED=0
    -DAGV_STRAIGHT_CALIBRATION_MOTOR_ENABLED=0
    -DAGV_TURN_CALIBRATION_ENABLED=1
    -DAGV_TURN_CALIBRATION_MOTOR_ENABLED=1
    -DAGV_TURN_CALIBRATION_DIRECTION=1

; Explicit opt-in counterclockwise 90-degree point-turn test.
[env:esp32dev-turn-calibration-ccw]
build_src_filter =
    -<*>
    +<MotionController.cpp>
    +<PhysicalFleetAuthorization.cpp>
    +<TurnCalibrationMain.cpp>
build_flags =
    -DAGV_RAISED_WHEEL_BUILD=0
    -DAGV_MOTOR_OUTPUTS_ENABLED=1
    -DAGV_TRAJECTORY_PREVIEW_ENABLED=0
    -DAGV_TRAJECTORY_TRACE_ENABLED=0
    -DAGV_PHYSICAL_FLEET_ENABLED=0
    -DAGV_PHYSICAL_FLEET_MOTOR_ENABLED=0
    -DAGV_STRAIGHT_CALIBRATION_ENABLED=0
    -DAGV_STRAIGHT_CALIBRATION_MOTOR_ENABLED=0
    -DAGV_TURN_CALIBRATION_ENABLED=1
    -DAGV_TURN_CALIBRATION_MOTOR_ENABLED=1
    -DAGV_TURN_CALIBRATION_DIRECTION=2

; USB-only encoder mapper. The diagnostic entrypoint is compiled, but the
; bridge has no reachable STBY HIGH or nonzero PWM path.
[env:esp32dev-channel-diagnostic-locked]
build_src_filter =
    -<*>
    +<MotorChannelDiagnosticMain.cpp>
build_flags =
    -DAGV_CHANNEL_DIAGNOSTIC_ENABLED=1
    -DAGV_CHANNEL_DIAGNOSTIC_MOTOR_ENABLED=0
    -DAGV_CHANNEL_DIAGNOSTIC_CHANNEL=1
    -DAGV_MOTOR_OUTPUTS_ENABLED=0

; Raised-wheel-only A output check: AO1/AO2 should turn the physical left
; wheel forward and only the GPIO19/18 encoder count should advance.
[env:esp32dev-channel-diagnostic-a]
build_src_filter =
    -<*>
    +<MotorChannelDiagnosticMain.cpp>
build_flags =
    -DAGV_CHANNEL_DIAGNOSTIC_ENABLED=1
    -DAGV_CHANNEL_DIAGNOSTIC_MOTOR_ENABLED=1
    -DAGV_CHANNEL_DIAGNOSTIC_CHANNEL=1
    -DAGV_MOTOR_OUTPUTS_ENABLED=1

; Raised-wheel-only B output check: BO1/BO2 should turn the physical right
; wheel forward and only the GPIO17/16 encoder count should advance.
[env:esp32dev-channel-diagnostic-b]
build_src_filter =
    -<*>
    +<MotorChannelDiagnosticMain.cpp>
build_flags =
    -DAGV_CHANNEL_DIAGNOSTIC_ENABLED=1
    -DAGV_CHANNEL_DIAGNOSTIC_MOTOR_ENABLED=1
    -DAGV_CHANNEL_DIAGNOSTIC_CHANNEL=2
    -DAGV_MOTOR_OUTPUTS_ENABLED=1
